services:
  - type: web
    name: freeman-ai-proxy
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MODEL_TIMEOUT_MS
        value: "12000"
      - key: OPENROUTER_MODELS
        value: "inclusionai/ring-2.6-1t:free,deepseek/deepseek-v4-flash:free,google/gemma-4-26b-a4b-it:free,openai/gpt-oss-20b:free,meta-llama/llama-3.2-3b-instruct:free"
