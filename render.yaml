services:
  - type: web
    name: freeman-ai-proxy
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MODEL_TIMEOUT_MS
        value: "9000"
      - key: AI_OVERALL_TIMEOUT_MS
        value: "28000"
      - key: MAX_REQUESTS_PER_MIN
        value: "20"
      - key: OPENROUTER_MODELS
        value: "deepseek/deepseek-v4-flash:free,google/gemma-4-26b-a4b-it:free,openai/gpt-oss-20b:free,minimax/minimax-m2.5:free,nvidia/nemotron-3-nano-30b-a3b:free,openrouter/free"
